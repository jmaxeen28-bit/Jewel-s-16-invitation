<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>You're Invited!</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Background Audio -->
  <audio id="bgMusic" loop src="background-music.mp3"></audio>

  <!-- Envelope Screen -->
  <div id="envelope-screen" class="envelope-screen">
    <div id="openEnvelope" class="envelope-wrapper">
      <div class="envelope">
        <div class="flap"></div>
        <div class="pocket"></div>
        <div class="letter">
          <p>Click to Open</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Invitation Main Content -->
  <main id="invitation" class="invitation">
    <header class="header">
      <p class="sub-title">You are cordially invited to celebrate</p>
      <h1 class="main-title">A Special Day</h1>
      <p class="date-text">October 24, 2026 • 3:00 PM</p>
    </header>

    <!-- Countdown Section -->
    <section class="countdown-section">
      <h2>Counting Down The Days</h2>
      <div class="countdown">
        <div class="time-box">
          <span id="days">00</span>
          <p>Days</p>
        </div>
        <div class="time-box">
          <span id="hours">00</span>
          <p>Hours</p>
        </div>
        <div class="time-box">
          <span id="minutes">00</span>
          <p>Minutes</p>
        </div>
        <div class="time-box">
          <span id="seconds">00</span>
          <p>Seconds</p>
        </div>
      </div>
    </section>

    <!-- RSVP Section -->
    <section class="rsvp-section">
      <h2>RSVP</h2>
      <p>Will you be attending?</p>

      <div class="input-group">
        <input type="text" id="guestName" placeholder="Enter your full name" required />
      </div>

      <div class="rsvp-options">
        <button type="button" class="rsvp-option" data-answer="Yes, I'll be there!">
          <span>✨</span> Yes, I'll be there!
        </button>
        <button type="button" class="rsvp-option" data-answer="Maybe">
          <span>✧</span> Maybe
        </button>
        <button type="button" class="rsvp-option" data-answer="Sorry, I can't make it">
          <span>♡</span> Sorry, I can't make it
        </button>
      </div>

      <button id="submitRSVP" class="submit-btn">SEND RSVP</button>

      <!-- Response Box -->
      <div id="rsvpResponse" class="response-box">
        <h3 id="responseTitle"></h3>
        <p id="responseText"></p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
